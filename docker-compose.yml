version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: school_mgmt_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_password
      POSTGRES_DB: school_mgmt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: